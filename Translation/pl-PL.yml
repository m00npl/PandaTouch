    Nie można połączyć się z drukarką!
    Możliwe, że "Kod dostępu" jest nieprawidłowy. Kliknij "Edytuj", aby sprawdzić i ponownie wprowadzić "Kod dostępu".
    Aby rozwiązać problemy z połączeniem, zeskanuj kod QR.
  mqtt_never_connected: |
    Nie można połączyć się z drukarką!
    Upewnij się, że drukarka jest włączona i znajduje się w tej samej sieci LAN co Panda Touch lub kliknij "Edytuj", aby sprawdzić i ponownie wprowadzić "IP" i "SN".
    Aby rozwiązać problemy z połączeniem, zeskanuj kod QR.
  mqtt_master_changed: |
    Nie można połączyć się z drukarką!
    Upewnij się, że drukarka jest włączona i znajduje się w tej samej sieci LAN co Panda Touch lub kliknij "Edytuj", aby sprawdzić i ponownie wprowadzić "IP" i "SN".
    Ponieważ jest to drukarka "Główna", inna drukarka w grupie zostanie tymczasowo przypisana jako "Główna".
    Jeśli wyłączyłeś drukarkę, zignoruj tę wiadomość.
    Aby rozwiązać problemy z połączeniem, zeskanuj kod QR.
  mqtt_master_error: |
    Nie można połączyć się z drukarką!
    Upewnij się, że drukarka jest włączona i znajduje się w tej samej sieci LAN co Panda Touch lub kliknij "Edytuj", aby sprawdzić i ponownie wprowadzić "IP" i "SN".
    Ponieważ jest to drukarka "Główna" i nie ma innych podłączonych drukarek dostępnych w grupie, nie będziesz mógł korzystać z Panda Touch, dopóki problem nie zostanie rozwiązany.
    Aby rozwiązać problemy z połączeniem, zeskanuj kod QR.
  mqtt_slave: |
    Nie można połączyć się z drukarką!
    Upewnij się, że drukarka jest włączona i znajduje się w tej samej sieci LAN co Panda Touch lub kliknij "Edytuj", aby sprawdzić i ponownie wprowadzić "IP" i "SN".
    Ta drukarka nie jest "Główną", więc nie będzie dostępna ani nie będzie mogła naśladować drukarki "Głównej", jeśli znajduje się w grupie.
    Jeśli wyłączyłeś drukarkę, zignoruj tę wiadomość.
    Aby rozwiązać problemy z połączeniem, zeskanuj kod QR.
  mqtt_not_online: |
    Nie można połączyć się z drukarką!
    Upewnij się, że drukarka jest włączona i znajduje się w tej samej sieci LAN co Panda Touch.
    Aby rozwiązać problemy z połączeniem, zeskanuj kod QR.
